name: Reliability checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      MINGSHAI_LLM_PROVIDER: "off"
      MINGSHAI_AUTO_BUILD: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt && pip install -e '.[dev]'
      - run: python -m pytest -m 'not llm and not live'
      - run: python eval/check_acceptance.py
      - run: ruff check --select F mingshai eval tests
      - run: node --check mingshai/static/app.js
