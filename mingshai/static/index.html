<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>明筛 · 自然语言选股与策略解释器</title>
<meta name="description" content="把模糊的选股想法变成看得见、改得动、查得到出处的数据条件。大模型只翻译，确定性引擎出结果，数据来自同花顺金融数据 API（扶摇）。">
<meta name="theme-color" content="#1E2761">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<!-- IBM Plex 只用于数字和拉丁字母；加载失败（例如网络不通）时回退系统字体，不阻塞首屏 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="/static/icon.svg" alt="">
    <div>
      <div class="brand-name">明筛</div>
      <div class="brand-sub">每个条件看得见 · 每个数字有出处</div>
    </div>
  </div>
  <div class="top-status" id="topStatus"></div>
</header>
<div id="banner"></div>
<main class="wrap">
  <section class="card hero" id="stepInput"></section>
  <section class="card hidden" id="stepUnderstand"></section>
  <section class="card hidden" id="stepConditions"></section>
  <section class="card hidden" id="stepResults"></section>
  <section class="card" id="stepSaved"></section>
</main>
<footer class="foot">
  <p><b>合规声明</b>　明筛只按你设定的条件筛选并解释公开数据，不预测涨跌、不承诺收益、不构成任何买卖建议。历史数据和当期财务指标不代表未来表现。</p>
  <p><b>数据与方法</b>　数据来自同花顺金融数据 API（扶摇）。筛选和所有数字由确定性引擎计算；大模型只负责把自然语言翻译成条件，以及在数字守门器约束下写白话解读。<span id="footVersion"></span></p>
</footer>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="drawer-inner" id="drawerInner"></div></aside>
<div class="scrim" id="scrim"></div>
<div class="modal hidden" id="modal"><div class="modal-inner" id="modalInner"></div></div>
<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
