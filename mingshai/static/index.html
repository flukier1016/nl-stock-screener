<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>所以然 · 一句话选股</title>
<meta name="description" content="一句话选股，不只给名单，也讲清为什么。AI 只把话翻译成条件，程序用同花顺金融数据（扶摇）逐条筛选，每个数字都有出处。">
<meta name="theme-color" content="#1E2761">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<!-- IBM Plex 只用于数字和拉丁字母；加载失败（例如网络不通）时回退系统字体，不阻塞首屏 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" data-async-css
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="/static/icon.svg" alt="">
    <div>
      <div class="brand-name">所以然</div>
      <div class="brand-sub">不只给名单，也讲清为什么</div>
    </div>
  </div>
  <div class="top-status" id="topStatus"></div>
  <div id="themeBox"></div>
</header>
<div id="banner"></div>
<main class="wrap">
  <section class="card hero" id="stepInput"></section>
  <section class="card hidden" id="stepUnderstand"></section>
  <section class="card hidden" id="stepConditions"></section>
  <section class="card hidden" id="stepResults"></section>
  <section class="card" id="stepSaved"></section>
</main>
<footer class="foot">
  <p><b>合规</b>　只按你的条件筛选和解释数据，不预测涨跌，不构成投资建议。</p>
  <p><b>数据</b>　同花顺金融数据 API（扶摇）。数字全部由程序计算，AI 只负责理解你的话。<span id="footVersion"></span></p>
</footer>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="drawer-inner" id="drawerInner"></div></aside>
<div class="scrim" id="scrim"></div>
<div class="modal hidden" id="modal"><div class="modal-inner" id="modalInner"></div></div>
<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
